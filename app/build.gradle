plugins {
    id 'com.android.application'
}

android {
    namespace "fun.heyworld.tg2"
    compileSdk 36

    defaultConfig {
        applicationId "fun.heyworld.tg2"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            // keystore ada di root repo (di-decode dari GitHub Secret saat CI)
            storeFile file("../android.keystore")
            storePassword System.env.BUBBLEWRAP_KEYSTORE_PASSWORD ?: ""
            keyAlias "tg2"
            keyPassword System.env.BUBBLEWRAP_KEY_PASSWORD ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false
    }
}
